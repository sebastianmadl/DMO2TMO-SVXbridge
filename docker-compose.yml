services:
  dmo2tmo-svxbridge:
    build: .
    container_name: dmo2tmo-svxbridge
    restart: unless-stopped

    # Beim Beenden schliesst die Bruecke offene Gruppenrufe und leert die
    # Sendequeue, danach faehrt svxlink herunter. Wird sie vorher getoetet,
    # bleiben Rufe am brew-server als Geister stehen - siehe CLAUDE.md.
    stop_grace_period: 30s

    # Haengt im vorhandenen Proxy-Netz, statt ein eigenes aufzumachen. Der
    # Reverse-Proxy erreicht die Oberflaeche darin unter
    # `dmo2tmo-svxbridge:3006`.
    networks:
      - proxy_bridge

    # Zusaetzlich auf localhost, damit man am VPS selbst curl'n und
    # `webtest.py` laufen lassen kann. Nach aussen ist damit nichts offen -
    # das macht der Proxy. Kann weg, wer das nicht braucht.
    # Host-Port 3007, damit es nicht mit einer alten svxtetra-Instanz auf
    # 3006 kollidiert. Im Container und fuer den Proxy bleibt es 3006.
    ports:
      - "127.0.0.1:3007:3006"

    volumes:
      - ./data:/data

    environment:
      SVXTETRA_CONFIG: /data/config.yaml
      # Ohne das laeuft der Container auf UTC: die Logzeitstempel und das
      # Last Heard kaemen aus time.localtime(), der Zeitplan rechnet aber
      # mit `timezone` aus der config.yaml (Europe/Vienna). Im Sommer waeren
      # das zwei Stunden Unterschied - ein Fenster 20-22 Uhr schaltet dann
      # scheinbar um 18:00. Muss zur `timezone` in der config.yaml passen.
      TZ: Europe/Vienna

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3006/healthz', timeout=3)"]
      interval: 60s
      timeout: 5s
      start_period: 40s
      retries: 3

networks:
  # Muss am VPS schon da sein (der Proxy haengt drin):
  #   docker network create proxy_bridge
  proxy_bridge:
    external: true
